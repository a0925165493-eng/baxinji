# 八辛吉官網後台設定
backend:
  name: git-gateway
  repo: a0925165493-eng/baxinji
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/71138b3d-e4e8-4d82-958c-017301d62f0d/pkce
  auth_token_endpoint: /sites/71138b3d-e4e8-4d82-958c-017301d62f0d/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: "後台新增：{{collection}} {{slug}}（{{author-name}}）"
    update: "後台更新：{{collection}} {{slug}}（{{author-name}}）"
    delete: "後台刪除：{{collection}} {{slug}}（{{author-name}}）"
    uploadMedia: "上傳照片：{{path}}（{{author-name}}）"
    deleteMedia: "刪除照片：{{path}}（{{author-name}}）"

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

locale: zh_Hant
site_url: {{SITE}}
display_url: {{SITE}}
logo_url: {{SITE}}img/logo.png
media_folder: img
public_folder: img

collections:
  - name: settings
    label: 網站內容
    editor: { preview: false }
    files:
      - name: notice
        label: 📢 公告（臨時休息、活動）
        file: data/notice.json
        fields:
          - { name: show, label: 顯示公告, widget: boolean, default: false, hint: 打開才會出現在首頁大圖下方的紅色公告區；不需要時關掉即可 }
          - { name: title, label: 公告標題（大字）, widget: string, required: false, hint: "例如：12/31 跨年夜提早打烊" }
          - { name: text, label: 公告內容, widget: text, required: false, hint: "例如：當天營業到 20:00，1/1 照常營業。可以換行。" }
          - { name: link, label: 詳情連結（可不填）, widget: string, required: false, hint: 例如 FB 貼文網址 }

      - name: hours
        label: 🕒 營業時間
        file: data/hours.json
        fields:
          - { name: mon, label: 週一, widget: string, hint: "格式：11:00-14:00,16:00-21:30；休息就填「公休」" }
          - { name: tue, label: 週二, widget: string }
          - { name: wed, label: 週三, widget: string }
          - { name: thu, label: 週四, widget: string }
          - { name: fri, label: 週五, widget: string }
          - { name: sat, label: 週六, widget: string }
          - { name: sun, label: 週日, widget: string }

      - name: menu
        label: 📋 菜單與價格
        file: data/menu.json
        fields:
          - { name: updated, label: 菜單更新日期, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: false }
          - name: categories
            label: 菜單分類
            label_singular: 分類
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: 分類名稱, widget: string }
              - { name: note, label: 分類說明（可不填）, widget: text, required: false }
              - name: items
                label: 品項
                label_singular: 品項
                widget: list
                summary: "{{fields.name}}　${{fields.price}}"
                fields:
                  - { name: name, label: 品名, widget: string }
                  - { name: detail, label: 補充（例如 3顆、380ml，可不填）, widget: string, required: false }
                  - { name: price, label: 價格（只填數字）, widget: string, pattern: ['^\d+$', '價格只能填數字'] }
                  - { name: spicy, label: 麻辣口味（顯示辣椒）, widget: boolean, default: false }

      - name: featured
        label: ⭐ 招牌必點、麵食（有照片的卡片）
        file: data/featured.json
        fields:
          - name: signature
            label: 招牌必點
            label_singular: 招牌
            widget: list
            summary: "{{fields.name}}"
            fields: &card
              - { name: tag, label: 小標籤, widget: string, required: false }
              - { name: name, label: 品名, widget: string }
              - { name: desc, label: 介紹, widget: text, required: false }
              - { name: price, label: 價格（只填數字）, widget: string, pattern: ['^\d+$', '價格只能填數字'] }
              - { name: spicy, label: 麻辣口味, widget: boolean, default: false }
              - { name: img, label: 照片, widget: image, required: false, choose_url: false }
          - name: noodles
            label: 麵食系列
            label_singular: 麵食
            widget: list
            summary: "{{fields.name}}"
            fields: *card

      - name: videos
        label: 🎬 影片（TikTok／IG／YouTube）
        file: data/videos.json
        fields:
          - name: list
            label: 影片（由上到下依序顯示，按住左邊 ⋮⋮ 拖曳就能調整順序）
            label_singular: 影片
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            hint: "清單預設收合成一行一支，按住每列左邊的 ⋮⋮ 上下拖曳就能換順序；點標題可展開修改。手機拖不動的話，用下面每支影片的「排序」填數字也可以。"
            fields:
              - { name: id, label: 影片連結（TikTok、IG 貼文／Reels、YouTube）, widget: string, hint: "TikTok、Instagram（貼文或 Reels）、YouTube 按「分享 → 複製連結」直接貼上就好。IG 記得自己上傳封面圖（IG 不讓網站自動抓）。TikTok 建議貼完整網址（tiktok.com/@帳號/video/數字），短網址也能用，但只能點開到 TikTok 看。YouTube 沒放封面會自動抓影片縮圖" }
              - { name: title, label: 標題, widget: string }
              - { name: desc, label: 一句話說明, widget: string, required: false }
              - { name: cover, label: 封面圖（直式照片，建議 1MB 以下）, widget: image, required: false, choose_url: false }
              - { name: order, label: 排序（選填）, widget: number, value_type: int, required: false, hint: "填 1、2、3⋯數字小的排前面；不填就照清單順序排在後面" }

      - name: shop
        label: 🏠 店家資料
        file: data/shop.json
        fields:
          - { name: name, label: 店名（Google、分享預覽、頁尾用）, widget: string }
          - { name: headerName, label: 網站左上角顯示的店名, widget: string }
          - { name: branch, label: 分店名, widget: string, required: false }
          - { name: slogan, label: 首頁小標, widget: string, required: false }
          - { name: intro, label: 首頁介紹, widget: text, required: false }
          - { name: story, label: 店家故事, widget: text, required: false }
          - { name: points, label: 店家特色（4 點）, widget: list, field: { name: p, label: 特色, widget: string } }
          - { name: address, label: 地址, widget: string }
          - { name: phone, label: 電話, widget: string }
          - { name: parking, label: 停車說明, widget: string, required: false }
          - { name: lineUrl, label: LINE 官方帳號連結, widget: string, required: false }
          - { name: facebook, label: Facebook 連結, widget: string, required: false }
          - { name: instagram, label: Instagram 連結, widget: string, required: false }
          - { name: tiktok, label: TikTok 連結, widget: string, required: false }
          - { name: youtube, label: YouTube 連結, widget: string, required: false }
          - { name: ubereats, label: Uber Eats 連結, widget: string, required: false }
          - { name: foodpanda, label: foodpanda 連結, widget: string, required: false }

      - name: faq
        label: ❓ 常見問題
        file: data/faq.json
        fields:
          - name: list
            label: 問題
            label_singular: 問題
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { name: q, label: 問題, widget: string }
              - { name: a, label: 回答, widget: text }

      - name: levels
        label: 🌶 辣度說明
        file: data/levels.json
        fields:
          - name: list
            label: 辣度（由不辣到最辣）
            label_singular: 辣度
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: 名稱, widget: string }
              - { name: sub, label: 小字, widget: string }
              - { name: msg, label: 說明, widget: text }
