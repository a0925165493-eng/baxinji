<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>八辛吉官網後台</title>
</head>
<body>
<a id="goHome" href="/" target="_blank" rel="noopener" title="在新分頁打開官網首頁">🏠 回官網首頁</a>
<style>
#goHome{position:fixed;left:16px;bottom:16px;z-index:99999;background:#8b1a1f;color:#fff;font:700 15px/1 "Noto Sans TC","Microsoft JhengHei",sans-serif;padding:12px 18px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px #0004}
#goHome:hover{background:#5e0c10}
</style>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
/* 打開後台時自動前往登入頁（Google 登入），不用再多按一次「登入」 */
(function(){
  var tries=0, KEY='bx_auto_login';
  if(sessionStorage.getItem(KEY)) return;          // 這個分頁已自動跳過一次，就不再自動跳（避免取消登入時一直跳）
  var t=setInterval(function(){
    if(++tries>40){clearInterval(t);return;}
    var b=[].slice.call(document.querySelectorAll('button')).find(function(x){return /^(登入|Login)$/i.test((x.textContent||'').trim());});
    if(b){clearInterval(t);sessionStorage.setItem(KEY,'1');b.click();}
    else if(document.querySelector('[class*="AppHeader"],[class*="SidebarContainer"]')){clearInterval(t);} // 已登入
  },250);
})();
</script>
</body>
</html>
