<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>八辛吉官網後台</title>
</head>
<body>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<style>
.bx-login{display:inline-flex!important;align-items:center;gap:10px;background:#fff!important;color:#3c4043!important;border:1px solid #dadce0!important;border-radius:999px!important;padding:12px 26px!important;font:600 16px/1 "Noto Sans TC","Microsoft JhengHei",sans-serif!important;box-shadow:0 2px 8px #0002!important;height:auto!important;cursor:pointer}
.bx-login:hover{background:#f7f8f8!important}
.bx-login svg.g{width:20px;height:20px}
a.bx-home{display:inline-flex!important;align-items:center;gap:6px;background:#8b1a1f!important;color:#fff!important;font:700 15px/1 "Noto Sans TC","Microsoft JhengHei",sans-serif!important;padding:10px 16px!important;border-radius:999px!important;text-decoration:none!important;white-space:nowrap}
a.bx-home:hover{background:#5e0c10!important}
</style>
<script>
/* 後台登入：把預設的「連結圖示＋登入」換成「Google 登入」按鈕，並在打開後台時自動前往登入 */
(function(){
  var G='<svg class="g" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
  var KEY='bx_auto_login', autoDone=!!sessionStorage.getItem(KEY);
  new MutationObserver(function(){
    var b=[].slice.call(document.querySelectorAll('button')).find(function(x){return !x.classList.contains('bx-login')&&/^(登入|Login|Login with Netlify Identity)$/i.test((x.textContent||'').trim());});
    var h=[].slice.call(document.querySelectorAll('a[class*="AppHeaderSiteLink"]')).find(function(a){return !a.classList.contains('bx-home');});
    if(h){h.classList.add('bx-home');h.textContent='🏠 回到前台';h.href='/';h.title='在新分頁打開官網首頁';}
    if(!b) return;
    b.classList.add('bx-login'); b.innerHTML=G+'<span>使用 Google 登入</span>';
    if(!autoDone){autoDone=true;sessionStorage.setItem(KEY,'1');setTimeout(function(){b.click();},300);}
  }).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
</body>
</html>
